<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - STREAMINGKU</title>
    <style>
        body { font-family: sans-serif; background: #141414; color: white; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 2px solid #e50914; padding-bottom: 10px; font-size: 24px; color: #e50914; }
        
        /* Area Login PIN */
        .pin-box { background: #222; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-top: 50px; text-align: center; }
        input[type="password"], input[type="text"] { background: #333; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; font-size: 16px; width: 80%; max-width: 300px; margin-bottom: 10px; text-align: center; }
        
        /* Tabel & List Data */
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .card-stat { background: #222; padding: 15px; border-radius: 6px; flex: 1; text-align: center; border: 1px solid #333; }
        .card-stat h3 { margin: 0; font-size: 14px; color: #aaa; }
        .card-stat p { margin: 5px 0 0 0; font-size: 24px; font-weight: bold; color: #2ecc71; }
        
        .user-table-wrapper { overflow-x: auto; background: #222; border-radius: 8px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid #333; }
        th { background: #000; color: #aaa; }
        
        .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-active { background: #2ecc71; color: #000; }
        .status-expired { background: #ff4d4d; color: white; }
        
        .btn { background: #e50914; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-secondary { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="pinArea" class="pin-box">
            <h3>🔒 Masukkan PIN Kunci Akses Admin</h3>
            <p style="color: #aaa; font-size: 12px; margin-bottom: 15px;">Halaman ini dilindungi enkripsi server rahasia.</p>
            <input type="password" id="adminPinInput" placeholder="Masukkan 6 Digit PIN"><br>
            <button class="btn" onclick="verifikasiPin()">Buka Akses Admin</button>
        </div>

        <div id="adminContent" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Control Panel Admin 🛠️</h1>
                <button class="btn btn-secondary" onclick="keluarAdmin()">Lock</button>
            </div>
            
            <div class="stats">
                <div class="card-stat">
                    <h3>Total Pelanggan Terdaftar</h3>
                    <p id="totalUsers">0</p>
                </div>
            </div>

            <h3 style="text-align: left; margin-top: 30px;">Daftar Pengguna Website</h3>
            <div class="user-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Masa Aktif Berakhir</th>
                            <th>Status</th>
                            <th>Aksi Perpanjang</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #aaa;">Memuat data user...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let SEED_PIN = localStorage.getItem('admin_session_pin') || '';

        // Otomatis cek session pin saat halaman dimuat
        if (SEED_PIN) {
            tampilkanDashboardAdmin();
        }

        function verifikasiPin() {
            const input = document.getElementById('adminPinInput').value;
            if (!input) return alert('PIN tidak boleh kosong!');
            
            SEED_PIN = input;
            tampilkanDashboardAdmin();
        }

        async function tampilkanDashboardAdmin() {
            try {
                const response = await fetch(`/api/admin-manage?pin=${SEED_PIN}`);
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'PIN Salah!');
                }
                
                // Jika PIN lolos validasi, simpan ke memori browser agar tidak mengetik ulang saat refresh
                localStorage.setItem('admin_session_pin', SEED_PIN);
                document.getElementById('pinArea').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                
                const users = await response.json();
                renderUserTable(users);

            } catch (error) {
                alert(error.message);
                keluarAdmin();
            }
        }

        function renderUserTable(users) {
            document.getElementById('totalUsers').innerText = users.length;
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada user mendaftar.</td></tr>';
                return;
            }

            const sekarang = new Date().getTime();

            users.forEach(user => {
                const formatTanggalDb = user.subUntil ? user.subUntil.replace(" ", "T") : '';
                const tanggalMasaAktif = formatTanggalDb ? new Date(formatTanggalDb).getTime() : 0;
                
                let statusText = "EXPIRED";
                let badgeClass = "status-expired";

                if (tanggalMasaAktif > sekarang) {
                    statusText = "PREMIUM";
                    badgeClass = "status-active";
                }

                const tampilTanggal = user.subUntil ? new Date(formatTanggalDb).toLocaleString('id-ID') : 'Belum Set';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold; color:#fff;">${user.username}</td>
                    <td style="color:#aaa;">${tampilTanggal}</td>
                    <td><span class="status-badge ${badgeClass}">${statusText}</span></td>
                    <td>
                        <button class="btn" onclick="perpanjangUser('${user.username}', 30)">+30 Hari</button>
                        <button class="btn btn-secondary" onclick="perpanjangUser('${user.username}', 0)" style="margin-left:5px; background:#c0392b;">Reset</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function perpanjangUser(username, jumlahHari) {
            let targetTanggalStr = "expired";
            
            if (jumlahHari > 0) {
                const tgl = new Date();
                tgl.setDate(tgl.getDate() + jumlahHari);
                
                // Format ke standar ISO YYYY-MM-DD HH:MM:SS untuk Supabase
                const yyyy = tgl.getFullYear();
                const mm = String(tgl.getMonth() + 1).padStart(2, '0');
                const dd = String(tgl.getDate()).padStart(2, '0');
                targetTanggalStr = `${yyyy}-${mm}-${dd} 23:59:59`;
            }

            const konfirmasi = confirm(`Apakah kamu yakin ingin mengubah masa aktif untuk user [ ${username} ]?`);
            if (!konfirmasi) return;

            try {
                const response = await fetch('/api/admin-manage', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-PIN': SEED_PIN
                    },
                    body: JSON.stringify({
                        username: username,
                        new_sub_until: targetTanggalStr
                    })
                });

                const resData = await response.json();
                if (!response.ok) throw new Error(resData.error);

                alert(resData.message);
                // Muat ulang data tabel otomatis setelah sukses update
                tampilkanDashboardAdmin();

            } catch (error) {
                alert('Gagal memperbarui: ' + error.message);
            }
        }

        function keluarAdmin() {
            localStorage.removeItem('admin_session_pin');
            document.getElementById('pinArea').style.display = 'block';
            document.getElementById('adminContent').style.display = 'none';
        }
    </script>
</body>
</html>
