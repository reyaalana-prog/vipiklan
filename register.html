<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Premium</title>
    <style>
        /* Desain Sinematik Modern ala STREAMINGKU */
        body {
            font-family: sans-serif;
            background: #141414;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: #000;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-sizing: border-box;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin: 20px;
            text-align: center;
        }

        .auth-container h2 {
            color: #e50914; /* Merah Neon */
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .auth-container p {
            font-size: 14px;
            color: #aaa;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e50914; /* Fokus merah menyala */
            background: #444;
        }

        /* Tombol Register */
        .btn-auth {
            background: #e50914;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(229,9,20,0.3);
            transition: all 0.2s ease;
        }

        .btn-auth:active {
            transform: scale(0.98);
        }

        /* Link Bawah */
        .auth-link {
            margin-top: 25px;
            font-size: 14px;
            color: #aaa !important;
        }

        .auth-link a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .auth-link a:hover {
            text-decoration: underline;
            color: #e50914;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Daftar Akun Streaming</h2>
        <p>Saksikan video premium tanpa iklan terganggu</p>
        
        <form id="registerForm">
            <div style="display: none !important;" aria-hidden="true">
                <input type="text" id="address_line_confirm" name="address_line_confirm" autocomplete="off" tabindex="-1">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Masukkan email aktif" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Buat password baru">
            </div>
            
            <button type="submit" class="btn-auth">Daftar Sekarang</button>
        </form>
        
        <p class="auth-link">Sudah punya akun? <a href="/login">Login di sini</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 🛡️ 1. VALIDASI HONEYPOT: Cek apakah input jebakan diisi oleh bot
            const jebakanBot = document.getElementById('address_line_confirm').value;
            if (jebakanBot !== "") {
                // Jangan kirim apa pun ke server. Beri notifikasi palsu agar bot-nya mengira pendaftaran berhasil lalu pergi.
                console.warn("Spam bot detected via honeypot.");
                alert("Pendaftaran akun berhasil!");
                window.location.href = '/login';
                return;
            }
            
            const usernameInput = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // 🛡️ 2. VALIDASI FORMAT USERNAME (Anti-Nama Aneh Bot)
            if (usernameInput.length < 4 || usernameInput.length > 15) {
                alert("Gagal: Username harus memiliki panjang antara 4 sampai 15 karakter!");
                return;
            }

            // Memaksa username hanya boleh berisi huruf kecil (a-z) dan angka (0-9) murni tanpa simbol/spasi
            const regexBersih = /^[a-z0-9]+$/;
            if (!regexBersih.test(usernameInput)) {
                alert("Gagal: Username hanya boleh berisi huruf kecil dan angka saja, tanpa spasi/simbol!");
                return;
            }

            try {
                // Mengirim data bersih ke backend Cloudflare Pages Functions
                const response = await fetch('/api/auth-register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: usernameInput, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    window.location.href = '/login'; 
                } else {
                    alert('Gagal: ' + data.error);
                }
            } catch (error) {
                alert('Terjadi kesalahan jaringan.');
            }
        });
    </script>
</body>
</html>
