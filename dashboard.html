<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Streaming Premium</title>
    <style>
        /* 1. SETUP DASAR */
        body { 
            font-family: sans-serif; 
            background: #141414; 
            color: white; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Kunci tinggi layar 100% */
        }

        /* 2. HEADER MINIMALIS */
        header { 
            background: #000;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 15px; 
            border-bottom: 1px solid #333;
            height: 50px;
            box-sizing: border-box;
        }

        header h2 { font-size: 16px; margin: 0; }
        .btn-logout { background: #333; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* 3. AREA VIDEO (BAGIAN ATAS - TERKUNCI) */
        .sticky-player-section {
            background: #000;
            width: 100%;
            z-index: 100;
            /* Di HP, bagian ini akan menempel di atas */
            position: sticky;
            top: 0;
            border-bottom: 2px solid #e50914; /* Garis merah Netflix style */
        }

        .video-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            aspect-ratio: 16/9;
            position: relative;
        }

        #playingTitle {
            font-size: 14px;
            background: #141414;
            margin: 0;
            padding: 10px;
            text-align: center;
            color: #ccc;
        }

        /* 4. AREA KATALOG (BAGIAN BAWAH - BISA DI-SCROLL) */
        .scrollable-content {
            flex: 1; /* Mengambil sisa layar */
            overflow-y: auto; /* Aktifkan scroll di area ini saja */
            padding: 15px;
            padding-bottom: 30px; /* Jeda bawah agar tidak mentok */
        }

        .playlist-title {
            font-size: 18px;
            margin-bottom: 15px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }

        /* GRID KATALOG ALA YOUTUBE */
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
        }

        @media (max-width: 480px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }

        .video-card { 
            background: #222; 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: pointer; 
            border: 1px solid #333; 
            transition: 0.2s; 
        }
        
        .video-card:active { transform: scale(0.95); } /* Efek tekan di HP */

        .video-thumbnail { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            object-fit: cover; 
            display: block; 
        }

        .video-info { padding: 8px; text-align: center; }
        .video-meta { font-size: 11px; color: #aaa; margin: 0; }

        .alert-expired { color: #ff4d4d; background: #2a1b1b; padding: 20px; border: 1px solid #ff4d4d; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <h2>Halo, <span id="userDisplay">...</span>!</h2>
        <button class="btn-logout" onclick="logout()">Keluar</button>
    </header>

    <div id="premiumArea" style="display: none; display: flex; flex-direction: column; flex: 1;">
        
        <div class="sticky-player-section">
            <div class="video-container">
                <iframe id="bunnyPlayer" src="" 
                        style="border:0;position:absolute;top:0;left:0;height:100%;width:100%;" 
                        allow="accelerometer;gyroscope;encrypted-media;picture-in-picture;" 
                        allowfullscreen="true">
                </iframe>
            </div>
            <p id="playingTitle">Selamat menonton dan siapkan tisu 🍿</p>
        </div>

        <div class="scrollable-content">
            <p style="font-size: 12px; color: #2ecc71; margin-bottom: 15px;">
                ✅ Premium Aktif sampai: <span id="dateDisplay"></span>
            </p>

            <h3 class="playlist-title">Koleksi Video Premium</h3>
            
            <div id="videoList" class="video-grid">
                <p style="color: #aaa;">Sedang mengambil daftar video...</p>
            </div>
        </div>

    </div>

    <div id="expiredArea" style="display: none; padding: 20px;" class="scrollable-content">
        <div class="alert-expired">
            <h3>🔒 Akses Terkunci!</h3>
            <p>Masa aktif kamu sudah kedaluwarsa. Silakan hubungi admin.</p>
            <button style="background:#e50914; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold;">Perpanjang Paket</button>
        </div>
    </div>

    <script>
        const LIBRARY_ID = "680881"; 
        const isLoggedIn = sessionStorage.getItem('isLoggedIn');
        const username = sessionStorage.getItem('username');
        const subUntil = sessionStorage.getItem('subUntil');

        if (isLoggedIn !== 'true' || !username) {
            window.location.href = '/login';
        } else {
            document.getElementById('userDisplay').innerText = username;
            
            const sekarang = new Date().getTime();
            
            if (!subUntil || subUntil === 'expired' || subUntil === 'null') {
                document.getElementById('expiredArea').style.display = 'block';
            } else {
                const formatTanggalDb = subUntil.replace(" ", "T");
                const tanggalMasaAktif = new Date(formatTanggalDb).getTime();
                
                if (tanggalMasaAktif > sekarang) {
                    document.getElementById('premiumArea').style.display = 'flex';
                    document.getElementById('dateDisplay').innerText = new Date(formatTanggalDb).toLocaleString('id-ID');
                    loadBunnyVideos();
                } else {
                    document.getElementById('expiredArea').style.display = 'block';
                }
            }
        }

        async function loadBunnyVideos() {
            try {
                const response = await fetch('/api/get-videos');
                const videos = await response.json();
                const container = document.getElementById('videoList');
                container.innerHTML = ''; 
                
                if (videos.error) throw new Error(videos.error);

                if (videos[0] && videos[0].guid) {
                    playVideo(videos[0].guid);
                }

                videos.forEach(video => {
                    if (!video.guid) return; 
                    const menit = Math.floor((video.length || 0) / 60);
                    const detik = (video.length || 0) % 60;
                    const durasi = `${menit}:${detik < 10 ? '0' : ''}${detik}`;

                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => {
                        playVideo(video.guid);
                        // Optional: Otomatis scroll ke atas sedikit jika di HP saat klik
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    };
                    
                    const thumbnailUrl = `https://vz-99c5be47-12d.b-cdn.net/${video.guid}/${video.thumbnailFileName}`;

                    card.innerHTML = `
                        <img class="video-thumbnail" src="${thumbnailUrl}" alt="Video" onerror="this.src='https://via.placeholder.com/320x180/222/fff?text=No+Thumbnail'">
                        <div class="video-info">
                            <p class="video-meta">⏱️ ${durasi}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                document.getElementById('videoList').innerHTML = `<p style="color: #ff4d4d;">Error: ${error.message}</p>`;
            }
        }

        function playVideo(videoId) {
            document.getElementById('playingTitle').innerText = "Selamat menonton dan siapkan tisu 🍿";
            const player = document.getElementById('bunnyPlayer');
            player.src = `https://iframe.mediadelivery.net/embed/${LIBRARY_ID}/${videoId}?autoplay=true`;
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
