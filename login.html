<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Streaming Premium</title>
    <style>
        /* Desain Sinematik Modern ala STREAMINGKU */
        body {
            font-family: sans-serif;
            background: #141414;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: #000;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-sizing: border-box;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin: 20px;
            text-align: center;
        }

        .auth-container h2 {
            color: #e50914; /* Merah Khas Netflix Style */
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .auth-container p {
            font-size: 14px;
            color: #aaa;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e50914; /* Border menyala merah saat diklik */
            background: #444;
        }

        /* Tombol Masuk/Login */
        button[type="submit"] {
            background: #e50914;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(229,9,20,0.3);
            transition: all 0.2s ease;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        /* Link Bagian Bawah */
        .auth-link-p {
            margin-top: 25px;
            font-size: 14px;
            color: #aaa !important;
        }

        .auth-link-p a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .auth-link-p a:hover {
            text-decoration: underline;
            color: #e50914;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Masuk Akun</h2>
        <p>Silakan masuk untuk melanjutkan menonton</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Masukkan username" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            
            <button type="submit">Masuk</button>
        </form>
        
        <p class="auth-link-p">Belum punya akun? <a href="/register">Daftar di sini</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    
                    // Simpan data login user ke Session Storage browser agar tidak hilang saat pindah halaman
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('username', data.user.username);
                    sessionStorage.setItem('subUntil', data.user.subscription_until || 'expired');
                    
                    // 🔥 ANTI-SHARING: Amankan token sesi yang dikirim server ke browser user
                    sessionStorage.setItem('sessionToken', data.user.session_token);

                    // Lempar user ke halaman utama streaming (dashboard.html)
                    window.location.href = '/dashboard';
                } else {
                    alert('Gagal: ' + data.error);
                }
            } catch (error) {
                alert('Terjadi kesalahan jaringan.');
            }
        });
    </script>
</body>
</html>
